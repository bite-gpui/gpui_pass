# Release `bite-gp-pass` to crates.io — bump, tag and publish from one dispatch.
#
# This is the publisher that used to be `bite-gpui/distribution`'s, where the crate was
# one of thirty-one published from a staged checkout of a branch. What moved is the part
# that was about uploading safely; what did not move is the machinery for publishing
# thirty-one crates in dependency order, which one crate does not need.
#
# What changed here, relative to `gpui_parley`'s first version of this file: **the
# version is computed rather than typed, and the workflow writes it.** There the release
# was a tag, and a human had to edit the manifest, commit, push, tag and push again
# before anything started. Here one dispatch does all of it, because the two halves only
# exist together — a tag that names a version nothing in the tree carries is the failure
# the checks below exist to prevent, and a workflow that owns the bump cannot produce one.
#
#   * **one trigger, and it does the whole release.** `workflow_dispatch` computes the
#     next version from the manifest, writes it, commits, tags, pushes and uploads. The
#     tag is no longer a trigger: a tag pushed by this workflow's own token would not
#     start one anyway (GitHub suppresses events raised by `GITHUB_TOKEN`), and a
#     tag-triggered path would be a second way to release that this one has to agree
#     with. `bump: none` is the escape hatch — it re-releases a version that is already
#     tagged, which is the recovery for an upload that failed after the tag was pushed.
#     The push is a direct commit to the dispatched branch, so a branch protected against
#     direct pushes refuses it — and it refuses it *before* anything reaches the registry,
#     which is the right order for that to fail in.
#   * **the bump has to move the lock, and only the lock's own version.** The root
#     package's version is recorded in `Cargo.lock`, so a `--locked` build would refuse
#     immediately after a bump. The release resolves the lock, then proves that nothing
#     but `bite-gp-pass`'s version moved (`scripts/release.py check-lock`): a dependency
#     that floated between two releases is a change to look at, not one for a release to
#     make quietly.
#   * **a dry run needs no approval and no token.** The packaging job writes only its own
#     checkout and never pushes, so iterating on the inputs costs nothing; the commit, the
#     tag and the push all live in the publishing job, which is the one behind the
#     environment.
#   * **the arithmetic is one file.** `scripts/release.py` holds it, both jobs call it,
#     and the publishing job asserts that the version it computed matches the one the
#     packaging job did. Two jobs that could disagree about a version is a way to publish
#     a tree that is not the tree that was verified.
#
# crates.io versions are immutable. `cargo publish` refuses a version that already
# exists, and the recovery for a bad release is `cargo yank`, never a re-upload.
#
# **Releasing against an older GPUI line is not supported yet.** The version computed
# here is always the amendment of whatever the manifest names, so a release tracks the
# line the branch is on. Publishing the same crate against, say, the 1.20 line as well
# would need a second branch or a per-line manifest, and is left until there is a reason
# to want it.
name: Release

run-name: "Release (${{ inputs.bump }}${{ inputs.dry_run && ', dry run' || '' }})"

on:
  # The one trigger. A dispatch with the defaults packages and verifies without
  # publishing, which is what makes it safe to reach for.
  workflow_dispatch:
    inputs:
      bump:
        description: 'which version slot to bump. none re-releases the tagged version, for recovery'
        type: choice
        options: [amendment, patch, minor, none]
        default: amendment
      dry_run:
        description: 'package, bump and verify without committing, tagging or uploading'
        type: boolean
        required: false
        default: true
      confirm:
        description: 'repeat the tag to confirm a real publish (vX.Y.Z)'
        required: false
        default: ''

# One upload at a time in this repository. A concurrency group is per-repository, so
# this cannot serialise against `bite-gpui/distribution`'s releases; crates.io is what
# does that, should both ever publish at once.
concurrency:
  group: registry-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No debug information, so a link step fits on a runner — the same setting the layer
  # stack's workflows use.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    env:
      BUMP: ${{ github.event.inputs.bump }}
      # On a real run, `confirm` has to repeat the tag. Nothing to type for a dry run,
      # and nothing to repeat for `none` beyond the tag it already names.
      CONFIRM: ${{ github.event.inputs.confirm }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/linux-deps

      # No `toolchain` input: the action reads this repository's `rust-toolchain.toml`,
      # so the compiler is pinned in one place rather than two, and a release is built
      # by the same compiler a checkout here would use.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # The version, from the manifest the release will carry, plus the one check that
      # needs the remote: whether the tag it implies already exists. `none` inverts that
      # check, because re-releasing a version that is not tagged has nothing to release.
      - name: Decide the version
        id: version
        run: |
          set -euo pipefail
          version="$(python3 .github/scripts/release.py next "$BUMP")"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          if [ "$BUMP" = "none" ] && [ "$exists" = "false" ]; then
            echo "::error title=no such tag::$tag is not a tag of this repository, so there is" \
                 "nothing to re-release. Use a bump instead of \`none\`."
            exit 1
          fi
          if [ "$BUMP" != "none" ] && [ "$exists" = "true" ]; then
            echo "::error title=tag exists::$tag already exists. A tag names one version," \
                 "so bump to the next slot or re-release $tag with \`none\`."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A dispatch says; nothing else does, now that the trigger is a dispatch alone.
      - name: Resolve the mode
        id: mode
        run: echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"

      - name: Refuse an unconfirmed publish
        run: |
          # Compared as a shell string because a dispatch's boolean input may arrive as
          # the string "true" or as a boolean.
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            exit 0
          fi
          if [ "$CONFIRM" != "${{ steps.version.outputs.tag }}" ]; then
            echo "::error title=unconfirmed::confirm ($CONFIRM) does not name the tag" \
                 "(${{ steps.version.outputs.tag }}). Repeat the tag to publish it, or" \
                 "leave dry_run checked."
            exit 1
          fi

      # The bump, and the proof that it moved the lock by exactly one entry. `cargo
      # metadata` resolves — which is what rewrites the lock — and `--locked` here would
      # defeat the point, so the check below is what stands in its place.
      - name: Bump the manifest
        if: ${{ github.event.inputs.bump != 'none' }}
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          python3 .github/scripts/release.py next "$BUMP" --write >/dev/null
          cargo metadata --format-version 1 >/dev/null
          python3 .github/scripts/release.py check-lock "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock

      # The verification this repository has, and here rather than in a workflow of its
      # own, because it costs seconds. `--locked` on both: the lock has settled above,
      # and neither suite is allowed to move it from here. The puffin line is what makes
      # the scope emitter a CI gate rather than a claim — it is the property a profiler
      # with an external GUI cannot have.
      - name: Test
        run: |
          cargo test --locked
          cargo test --locked --features test-support
          cargo test --locked --features puffin,test-support
          # The windowed examples cannot run without a display, but they can be compiled — which
          # is the only check that catches a break in `pass_demo` or `pass_lab` before a user does.
          cargo check --locked --features demo,puffin --examples

      # `cargo publish`'s own packaging and verification: the tarball, its manifest, and
      # the crate built as the root of its own build. A manifest the registry would
      # reject, or a file the crate reads that is not in the package, is found here
      # rather than mid-publish.
      #
      # `--allow-dirty` is load-bearing. The bump above wrote the manifest and the lock, and
      # nothing commits them until the publishing job, so the clean-tree check would refuse
      # here — for a dry run and for a real release alike, a failure with nothing to do with
      # the crate. Packaging the working tree is exactly what is wanted: it is the tree the
      # publishing job will commit and upload.
      - name: Package
        run: cargo publish --dry-run --locked --allow-dirty

      - name: Summarise
        env:
          MODE: ${{ steps.mode.outputs.dry_run }}
        run: |
          if [ "$MODE" = "false" ]; then
            echo "::notice title=release::${{ steps.version.outputs.tag }} will be published to crates.io"
          else
            echo "::notice title=dry run::${{ steps.version.outputs.tag }} was packaged and verified, not uploaded"
          fi

  publish:
    needs: prepare
    # `needs` already skips this when `prepare` fails; its result is named as well
    # because a failed job does not reliably expose the outputs its steps wrote.
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    # The push needs to write; the workflow's default is read, so this is the one job
    # that can move the branch and create the tag. It is also the job behind the
    # environment, so nothing is written before a reviewer lets it be.
    permissions:
      contents: write
    # The approval gate, and where CARGO_REGISTRY_TOKEN lives. Configure the environment
    # with required reviewers: it is the last thing between a dispatch and an irreversible
    # upload, and the only place the token is reachable from.
    environment: crates-io
    timeout-minutes: 60
    env:
      # The same input the packaging job read: this job recomputes the version on its own
      # checkout, and asserts the two agree.
      BUMP: ${{ github.event.inputs.bump }}
    steps:
      # The tagged commit when re-releasing one, so the tree that is published is the one
      # the tag names; the dispatched branch otherwise. A full clone, because this job is
      # the one that pushes.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.bump == 'none' && needs.prepare.outputs.tag || github.ref_name }}

      - uses: ./.github/actions/linux-deps

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # Only a job that names the environment can see the token, so this is the first
      # place it can be checked. Failing here costs seconds.
      #
      # There are two ways the upload fails on credentials, and they read differently. An
      # empty secret is caught here. A token whose *scope* does not cover this crate is
      # not: crates.io token scopes are **name prefix globs**, and the token the layer
      # stack publishes with is scoped to `bite_*` — which does not match `bite-gp-pass`,
      # because of the hyphen. The refusal is a 403 at upload, after everything has been
      # built.
      - name: Require the registry token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            exit 0
          fi
          echo "::error title=missing secret::CARGO_REGISTRY_TOKEN is empty. It belongs on" \
               "the \`crates-io\` environment of this repository (Settings -> Environments)," \
               "which is the only place this job reads it from, and it has to be a token" \
               "whose scope covers the name \`bite-gp-pass\`. Note that scopes are name" \
               "prefix globs: \`bite_*\` does not cover it. A hand release uses \`cargo login\`," \
               "or the same variable in the shell."
          exit 1

      # The bump again, on this job's own checkout, because the packaging job's working
      # tree is gone. It is deterministic — same input, same manifest, same version — and
      # the assertion is what makes that a checked property rather than an assumption.
      #
      # The tag is pushed **before** the upload. If the upload then fails, the tag names
      # a commit that exists and `bump: none` re-releases it; the other order would leave
      # a published crate with no tag to point at.
      - name: Commit and tag the bump
        if: ${{ github.event.inputs.bump != 'none' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          version="$(python3 .github/scripts/release.py next "$BUMP" --write)"
          if [ "$version" != "${{ needs.prepare.outputs.version }}" ]; then
            echo "::error title=version moved::this job computed $version, the packaging" \
                 "job computed ${{ needs.prepare.outputs.version }}. Nothing has been pushed."
            exit 1
          fi
          cargo metadata --format-version 1 >/dev/null
          python3 .github/scripts/release.py check-lock "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release $version"
          git tag "${{ needs.prepare.outputs.tag }}" -m "Release $version"
          git push origin "HEAD:$BRANCH"
          git push origin "${{ needs.prepare.outputs.tag }}"

      # Reached only with the token, an approval and (for a bump) a pushed tag. Packaging
      # and verification happened in `prepare`; this is the upload, and `cargo publish`
      # runs its own verify build before it makes one, so a failure here leaves the
      # registry untouched.
      #
      # **The log is written outside the checkout, and that is load-bearing.** `tee` opens
      # its output file when the pipeline is set up, before `cargo publish` looks at the
      # working tree — and cargo refuses to publish from a dirty tree, so a log written
      # into the repository makes its own step fail:
      #
      #     error: 1 files in the working directory contain changes that were not
      #     yet committed into git:\n        publish.log
      #
      # `RUNNER_TEMP` is the runner's scratch directory, outside the workspace. The check
      # itself is worth keeping: it is what ties an upload to the tagged commit, so this
      # is the log that moves and not the check that is relaxed.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          cargo publish --locked 2>&1 | tee "$RUNNER_TEMP/publish.log"

      - name: Keep the publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/publish.log
          if-no-files-found: ignore
